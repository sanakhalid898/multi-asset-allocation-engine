[project]
name = "multi-asset-allocation-engine"
version = "0.1.0"
description = "Bayesian multi-asset allocation engine with mandate-constrained optimization and pre-trade risk analysis."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",

    "plotly>=5.24",

    "yfinance>=0.2.50",
    "fredapi>=0.5",

    "cvxpy>=1.5",

    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",

    "pydantic>=2.9",
    "python-dotenv>=1.0",

    "pyarrow>=17.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.39",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # modern Python syntax
]

ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
